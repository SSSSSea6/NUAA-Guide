name: Build and Deploy NUAA Guide

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: a2b7fc794d1db64ae85a3a5aa96d645a
  CLOUDFLARE_PROJECT_NAME: nuaa-guide
  HUGO_VERSION: "0.121.1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate material metadata
        run: python scripts/validate_md_files.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build website
        run: hugo --gc --minify --cleanDestinationDir

      - name: Deploy guide origin Worker
        run: npx wrangler@latest deploy --config cloudflare/guide-origin-proxy/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy guide main Worker
        run: npx wrangler@latest deploy --config cloudflare/main-proxy-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy public --project-name="${CLOUDFLARE_PROJECT_NAME}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke public routes
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://www.nuaaguide.online/" \
            "https://www.nuaaguide.online/css/style.css" \
            "https://nuaa-guide.pages.dev/"; do
            echo "==> $url"
            curl -fsSI "$url" | tee /tmp/headers.txt
            grep -i '^cache-control:' /tmp/headers.txt || true
          done
