name: Build and Deploy NUAA Guide

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.121.1'
          extended: true

      - name: Build website
        run: hugo --minify

      - name: Install and run Pagefind
        run: |
          PAGEFIND_VERSION="1.1.0"
          wget https://github.com/cloudcannon/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          tar -xzf pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          
          # 运行 Pagefind，启用中文分词
          ./pagefind --site public --language zh --verbose
          
          echo "Pagefind 生成的文件:"
          ls -la public/pagefind/

      - name: Verify Pagefind deployment
        run: |
          echo "检查 Pagefind 索引文件:"
          if [ -d "public/pagefind" ]; then
            find public/pagefind -type f -name "pagefind-*.json" | head -n 5
          else
            echo "错误: pagefind 目录不存在"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
