name: Build and Deploy NUAA Guide

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.121.1'
          extended: true

      - name: Build website
        run: hugo --minify

      - name: Install and run Pagefind
        run: |
          # 使用特定版本的 Pagefind
          PAGEFIND_VERSION="1.1.0"
          wget https://github.com/cloudcannon/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          tar -xzf pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          ./pagefind --site public --verbose
          
          # 检查生成的文件
          echo "Pagefind 生成的文件:"
          ls -la public/pagefind/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
