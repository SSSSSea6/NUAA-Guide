name: Build and Deploy NUAA Guide

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hk
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.121.1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate material metadata
        run: python scripts/validate_md_files.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build website
        run: hugo --gc --minify --cleanDestinationDir

      # The server side is deploy/hk/nuaaguide-deploy.sh, bound to this key as a forced command.
      - name: Deploy to Hong Kong server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.HK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HK_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.HK_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.HK_DEPLOY_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C public . | ssh -T -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "nuaaguide@$DEPLOY_HOST" deploy

      - name: Smoke public routes
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local expected="$1" url="$2" code
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code $url"
            [ "$code" = "$expected" ]
          }
          check 200 "https://www.nuaaguide.online/"
          check 200 "https://nuaaguide.online/"
          check 200 "https://www.nuaaguide.online/materials/"
          check 200 "https://www.nuaaguide.online/css/style.css"
          check 404 "https://www.nuaaguide.online/no-such-page/"
