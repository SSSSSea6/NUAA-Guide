name: Validate Site Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pypinyin

      - name: Install Hugo
        run: |
          curl -L https://github.com/gohugoio/hugo/releases/download/v0.121.1/hugo_extended_0.121.1_linux-amd64.deb -o hugo.deb
          sudo dpkg -i hugo.deb

      - name: Validate Markdown files
        run: |
          python scripts/validate_md_files.py

      - name: Validate generated search data
        run: |
          python scripts/build_search_manifest.py --check

      - name: Build site
        run: |
          hugo --gc --minify --cleanDestinationDir

      - name: Verify build output
        run: |
          echo "Inspecting build output"
          ls -la public/
          echo "Checking materials pages:"
          find public/ -name "*material*" -o -name "*学习*" | head -10
          echo "Checking homepage"
          if [ -f public/index.html ]; then
            echo "Homepage exists"
          else
            echo "Error: homepage does not exist"
            exit 1
          fi
