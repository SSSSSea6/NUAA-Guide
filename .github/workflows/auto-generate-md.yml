name: Auto Generate Markdown Files with R2

on:
  push:
    paths:
      - 'uploads/**'
  workflow_dispatch:

jobs:
  process-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          pip install boto3
          
      - name: Set up R2 credentials
        run: |
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> $GITHUB_ENV
          
      - name: Process files with R2
        run: |
          python scripts/process_with_r2.py
          
        - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/materials/
          git add static/files/
          git add uploads/.gitkeep
          git commit -m "自动添加学习资源（使用R2存储）[skip ci]" || echo "没有更改可提交"
          git push
