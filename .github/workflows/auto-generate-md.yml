name: Auto Generate Markdown Files

on:
  push:
    paths:
      - "static/files/**"
  workflow_dispatch:

jobs:
  generate-markdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml awscli

      - name: Run improved auto-generate script
        env:
          R2_BASE_URL: "https://assets.nuaa.cc"
        run: |
          python scripts/improved_auto_generate.py

      - name: Validate generated Markdown files
        run: |
          python scripts/validate_md_files.py

      - name: Upload assets to Cloudflare R2
        if: success()
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws s3 sync static/files/ s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --cache-control "public, max-age=31536000, immutable"

      - name: Clean up uploaded files from repository
        run: |
          if [ -d "static/files" ] && [ "$(ls -A static/files)" ]; then
            echo "Removing files from static/files..."
            find static/files -type f -not -name '.gitkeep' -delete
          else
            echo "static/files is empty or does not exist, skipping cleanup."
          fi

      - name: Check for changes
        id: check_changes
        run: |
          git status
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          CHANGES=$(git diff --staged --name-status)
          if echo "$CHANGES" | grep -q "D.*static/files/"; then
            COMMIT_MSG="feat: Sync new learning resources and clean up repo"
          elif echo "$CHANGES" | grep -q "A.*content/materials/"; then
            COMMIT_MSG="feat: Add new learning resources"
          else
            COMMIT_MSG="chore: Update learning resources"
          fi

          git commit -m "$COMMIT_MSG"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: Report no changes
        if: steps.check_changes.outputs.changes == 'false'
        run: echo "No changes to commit"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.121.1"
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build website
        run: hugo --gc --minify --cleanDestinationDir

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy public --project-name=nuaa-guide --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: a2b7fc794d1db64ae85a3a5aa96d645a
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke public routes
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://www.nuaaguide.online/" \
            "https://nuaa-guide.pages.dev/"; do
            echo "==> $url"
            curl -fsSI "$url" | tee /tmp/headers.txt
            grep -i '^cache-control:' /tmp/headers.txt || true
          done
