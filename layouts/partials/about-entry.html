<section class="home-entry" aria-labelledby="homeEntryTitle">
  <div class="ambient-image-bg ambient-image-bg--home" aria-hidden="true">
    <span class="ambient-image-bg__asset ambient-image-bg__asset--logo">
      <img src="/images/logo-160.webp" alt="" width="160" height="160" loading="lazy" decoding="async">
    </span>
    <span class="ambient-image-bg__asset ambient-image-bg__asset--book">
      <img src="/images/ambient/book-open.svg" alt="" width="80" height="80" loading="lazy" decoding="async">
    </span>
    <span class="ambient-image-bg__asset ambient-image-bg__asset--cap">
      <img src="/images/ambient/graduation-cap.svg" alt="" width="80" height="80" loading="lazy" decoding="async">
    </span>
    <span class="ambient-image-bg__asset ambient-image-bg__asset--compass">
      <img src="/images/ambient/compass.svg" alt="" width="80" height="80" loading="lazy" decoding="async">
    </span>
    <span class="ambient-image-bg__asset ambient-image-bg__asset--atom">
      <img src="/images/ambient/atom.svg" alt="" width="80" height="80" loading="lazy" decoding="async">
    </span>
  </div>

  <div class="home-entry__copy">
    <div class="home-entry__mobile-logo" aria-hidden="true">
      <img src="/images/logo-320.webp"
           alt=""
           width="160"
           height="160"
           decoding="async">
    </div>
    <h1 id="homeEntryTitle" class="home-entry__title">你好，同学</h1>
    <div class="home-entry__public" aria-label="欢迎语">
      <p>欢迎加入NUAA Guide。</p>
    </div>
  </div>

  <div class="home-access" aria-label="常用入口">
    <section class="home-access__item">
      <div class="home-access__text">
        <h2>添加小程序</h2>
        <p>更方便的学习资料和工具入口</p>
      </div>
      <button type="button"
              class="home-entry__link home-entry__link--button home-access__icon-link"
              data-mini-program-open
              aria-label="打开微信小程序">
        <img src="/images/icons/wechat.webp"
             alt="微信小程序"
             width="82"
             height="82"
             loading="lazy"
             decoding="async">
      </button>
    </section>

    <section class="home-access__item">
      <div class="home-access__text">
        <h2>加入QQ频道</h2>
        <p>与同学们交流</p>
      </div>
      <a class="home-entry__link home-access__icon-link"
         href="https://pd.qq.com/s/ejmvp2pdp?b=9"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="加入QQ频道">
        <img src="/images/icons/qq.webp"
             alt="QQ"
             width="82"
             height="82"
             loading="lazy"
             decoding="async">
      </a>
    </section>

    <section class="home-access__item home-access__item--news">
      <div class="home-access__text">
        <h2>关注社交平台</h2>
        <p>随时获取最新消息。</p>
      </div>
      <div class="home-access__icons" aria-label="消息渠道">
        <a class="home-entry__link"
           href="https://xhslink.com/m/2d5U203HNfp"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="小红书">
          <img src="/images/icons/xiaohongshu.webp"
               alt="小红书"
               width="82"
               height="82"
               loading="lazy"
               decoding="async">
        </a>
        <a class="home-entry__link"
           href="https://b23.tv/5aW5JSg"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="B站">
          <img src="/images/icons/bilibili.webp"
               alt="B站"
               width="82"
               height="82"
               loading="lazy"
               decoding="async">
        </a>
      </div>
    </section>

    <p class="home-access__hint">
      <span class="home-access__hint-icon" aria-hidden="true">i</span>
      <span>点击对应图标以跳转</span>
    </p>
  </div>
</section>
