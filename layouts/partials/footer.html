<div id="miniProgramBridge"
     data-scheme="{{ .Site.Params.mini_program_scheme | default "" | htmlEscape }}"
     data-scheme-api="{{ .Site.Params.mini_program_scheme_api | default "" | htmlEscape }}"
     hidden></div>

<script>
  const MINI_PROGRAM_SCHEME_STORAGE_KEY = 'nuaa-mini-program-scheme-cache-v1';
  const MINI_PROGRAM_SCHEME_TTL_MS = 30 * 60 * 1000;
  const MINI_PROGRAM_SCHEME_REQUEST_TIMEOUT_MS = 6000;
  let miniProgramSchemePromise = null;
  let miniProgramSchemePromiseKey = '';
  let cachedMiniProgramScheme = '';
  let cachedMiniProgramSchemeKey = '';

  function getMiniProgramBridgeConfig() {
    const bridge = document.getElementById('miniProgramBridge');
    return {
      scheme: bridge?.dataset.scheme?.trim() || '',
      schemeApi: bridge?.dataset.schemeApi?.trim() || ''
    };
  }

  function readStoredMiniProgramScheme() {
    try {
      const raw = localStorage.getItem(MINI_PROGRAM_SCHEME_STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      const scheme = typeof parsed.scheme === 'string' ? parsed.scheme.trim() : '';
      const key = typeof parsed.key === 'string' ? parsed.key : '';
      const storedAt = Number(parsed.storedAt || 0);
      if (!scheme || !key || !storedAt) return null;
      if (Date.now() - storedAt > MINI_PROGRAM_SCHEME_TTL_MS) {
        localStorage.removeItem(MINI_PROGRAM_SCHEME_STORAGE_KEY);
        return null;
      }
      return { scheme, key, storedAt };
    } catch (error) {
      console.warn('[mini-program] unable to read stored scheme cache:', error);
      return null;
    }
  }

  function persistMiniProgramScheme(scheme, key) {
    if (!scheme || !key) return;
    try {
      localStorage.setItem(MINI_PROGRAM_SCHEME_STORAGE_KEY, JSON.stringify({
        scheme,
        key,
        storedAt: Date.now()
      }));
    } catch (error) {
      console.warn('[mini-program] unable to persist scheme cache:', error);
    }
  }

  function extractMiniProgramScheme(payload) {
    if (!payload) return '';
    if (typeof payload === 'string') return payload.trim();
    return [
      payload.url,
      payload.scheme,
      payload.openlink,
      payload.openLink,
      payload.link
    ].find((value) => typeof value === 'string' && value.trim())?.trim() || '';
  }

  function getCurrentMiniProgramContextPath() {
    const pathname = window.location.pathname || '/';
    const search = window.location.search || '';
    return `${pathname}${search}`;
  }

  function getImmediateMiniProgramScheme() {
    const pageContextPath = getCurrentMiniProgramContextPath();
    if (cachedMiniProgramScheme && (cachedMiniProgramSchemeKey === pageContextPath || cachedMiniProgramSchemeKey === '__static__')) {
      return cachedMiniProgramScheme;
    }

    const storedScheme = readStoredMiniProgramScheme();
    if (storedScheme && (storedScheme.key === pageContextPath || storedScheme.key === '__static__')) {
      cachedMiniProgramScheme = storedScheme.scheme;
      cachedMiniProgramSchemeKey = storedScheme.key;
      return cachedMiniProgramScheme;
    }

    const config = getMiniProgramBridgeConfig();
    if (config.scheme) {
      cachedMiniProgramScheme = config.scheme;
      cachedMiniProgramSchemeKey = '__static__';
      persistMiniProgramScheme(cachedMiniProgramScheme, cachedMiniProgramSchemeKey);
      return cachedMiniProgramScheme;
    }
    return '';
  }

  function navigateToMiniProgramScheme(scheme) {
    if (!scheme) return false;
    window.location.href = scheme;
    window.setTimeout(() => setMiniProgramButtonsBusy(false), 1200);
    return true;
  }

  async function fetchMiniProgramScheme(endpointUrl) {
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const timeoutId = controller
      ? window.setTimeout(() => controller.abort(), MINI_PROGRAM_SCHEME_REQUEST_TIMEOUT_MS)
      : null;

    try {
      const response = await fetch(endpointUrl, {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store',
        signal: controller?.signal,
        headers: { Accept: 'application/json, text/plain;q=0.9' }
      });

      if (!response.ok) {
        throw new Error(`mini program scheme request failed: ${response.status}`);
      }

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json')
        ? await response.json()
        : await response.text();
      const scheme = extractMiniProgramScheme(payload);

      if (!scheme) {
        throw new Error('mini program scheme response is empty');
      }

      return scheme;
    } finally {
      if (timeoutId) {
        window.clearTimeout(timeoutId);
      }
    }
  }

  function describeMiniProgramError(error) {
    const message = error instanceof Error ? error.message : String(error || '');
    if (message.includes('Failed to fetch')) {
      return '当前网络或浏览器拦截了小程序接口请求，请稍后重试，或更换网络/浏览器。';
    }
    if (message.includes('abort') || message.includes('timeout')) {
      return '小程序接口响应超时，请稍后重试。';
    }
    if (message.includes('502') || message.includes('500')) {
      return '小程序接口暂时不可用，请稍后再试。';
    }
    if (message.includes('response is empty')) {
      return '小程序接口返回了空链接，请稍后再试。';
    }
    if (message.includes('not configured')) {
      return '小程序链接尚未配置完成，请联系维护者处理。';
    }
    return '暂时无法拉起小程序，请稍后重试。';
  }

  async function resolveMiniProgramScheme() {
    const pageContextPath = getCurrentMiniProgramContextPath();
    if (cachedMiniProgramScheme && (cachedMiniProgramSchemeKey === pageContextPath || cachedMiniProgramSchemeKey === '__static__')) {
      return cachedMiniProgramScheme;
    }

    const config = getMiniProgramBridgeConfig();
    if (config.scheme) {
      cachedMiniProgramScheme = config.scheme;
      cachedMiniProgramSchemeKey = '__static__';
      persistMiniProgramScheme(cachedMiniProgramScheme, cachedMiniProgramSchemeKey);
      return cachedMiniProgramScheme;
    }

    if (!config.schemeApi) return '';

    if (miniProgramSchemePromise && miniProgramSchemePromiseKey === pageContextPath) {
      return miniProgramSchemePromise;
    }

    miniProgramSchemePromiseKey = pageContextPath;
    miniProgramSchemePromise = (async () => {
      const requestKey = pageContextPath;
      const endpoint = new URL(config.schemeApi, window.location.origin);
      endpoint.searchParams.set('path', requestKey);
      let lastError = null;
      let scheme = '';

      for (let attempt = 0; attempt < 2; attempt += 1) {
        try {
          scheme = await fetchMiniProgramScheme(endpoint.toString());
          break;
        } catch (error) {
          lastError = error;
          if (attempt === 0) {
            await new Promise((resolve) => window.setTimeout(resolve, 300));
          }
        }
      }

      if (!scheme) {
        throw lastError || new Error('mini program scheme response is empty');
      }

      cachedMiniProgramScheme = scheme;
      cachedMiniProgramSchemeKey = requestKey;
      persistMiniProgramScheme(cachedMiniProgramScheme, cachedMiniProgramSchemeKey);
      return cachedMiniProgramScheme;
    })().catch((error) => {
      if (miniProgramSchemePromiseKey === pageContextPath) {
        miniProgramSchemePromise = null;
        miniProgramSchemePromiseKey = '';
      }
      throw error;
    });

    return miniProgramSchemePromise;
  }

  function setMiniProgramButtonsBusy(isBusy) {
    document.querySelectorAll('[data-mini-program-open]').forEach((button) => {
      button.setAttribute('aria-busy', String(isBusy));
      if ('disabled' in button) {
        button.disabled = isBusy;
      }
    });
  }

  async function openMiniProgram(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }

    setMiniProgramButtonsBusy(true);
    try {
      const immediateScheme = getImmediateMiniProgramScheme();
      if (navigateToMiniProgramScheme(immediateScheme)) {
        return;
      }

      const scheme = await resolveMiniProgramScheme();
      if (!navigateToMiniProgramScheme(scheme)) {
        throw new Error('mini program scheme is not configured');
      }
    } catch (error) {
      console.warn('[mini-program] unable to open mini program:', error);
      setMiniProgramButtonsBusy(false);
      window.alert(describeMiniProgramError(error));
    }
  }

  function bindMiniProgramButtons() {
    document.querySelectorAll('[data-mini-program-open]').forEach((button) => {
      if (button.dataset.miniProgramBound === 'true') {
        return;
      }
      button.dataset.miniProgramBound = 'true';
      button.addEventListener('click', openMiniProgram);
    });
  }

  function preloadMiniProgramScheme() {
    if (!document.querySelector('[data-mini-program-open]')) {
      return;
    }
    resolveMiniProgramScheme().catch(() => {});
  }

  window.openMiniProgram = openMiniProgram;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      bindMiniProgramButtons();
      preloadMiniProgramScheme();
    }, { once: true });
  } else {
    bindMiniProgramButtons();
    preloadMiniProgramScheme();
  }
</script>
