<!-- 全站公告弹窗 -->
<div id="miniProgramBridge"
     data-scheme="{{ .Site.Params.mini_program_scheme | default "" | htmlEscape }}"
     data-scheme-api="{{ .Site.Params.mini_program_scheme_api | default "" | htmlEscape }}"
     hidden></div>

<div id="siteAnnouncementModal"
     class="site-announcement-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="siteAnnouncementTitle"
     aria-describedby="siteAnnouncementDesc"
     style="display:none">
  <div class="site-announcement-modal__content">
    <button type="button"
            class="site-announcement-modal__close"
            onclick="closeSiteAnnouncementModal()"
            aria-label="关闭公告">
      ×
    </button>
    <p class="site-announcement-modal__eyebrow">NUAA Guide 工具箱公告</p>
    <h3 id="siteAnnouncementTitle">学习资料在小程序中已全部可用，下载速度更快。</h3>
    <div id="siteAnnouncementDesc" class="site-announcement-modal__body">
      <p>点击下方按钮可自动拉起微信并进入 NUAA Guide 小程序。</p>
    </div>
    <div class="site-announcement-modal__actions">
      <button type="button"
              class="site-announcement-modal__action site-announcement-modal__action--miniapp"
              data-mini-program-open
              onclick="openMiniProgram(event)">
        打开小程序
      </button>
      <button type="button"
              class="site-announcement-modal__action site-announcement-modal__action--secondary"
              onclick="closeSiteAnnouncementModal()">
        继续浏览
      </button>
    </div>
  </div>
</div>

<script>
  const SITE_ANNOUNCEMENT_SESSION_KEY = 'nuaa-site-announcement-shown';
  const MATERIALS_ANNOUNCEMENT_SESSION_KEY = 'nuaa-materials-announcement-shown';
  let miniProgramSchemePromise = null;
  let cachedMiniProgramScheme = '';

  function openSiteAnnouncementModal() {
    const modal = document.getElementById('siteAnnouncementModal');
    if (!modal) return;
    modal.style.display = 'block';
    document.body.classList.add('has-site-announcement-open');
  }

  function closeSiteAnnouncementModal() {
    const modal = document.getElementById('siteAnnouncementModal');
    if (!modal) return;
    modal.style.display = 'none';
    document.body.classList.remove('has-site-announcement-open');
  }

  function isMaterialsAnnouncementPath(pathname) {
    const path = (pathname || window.location.pathname || '').replace(/index\.html$/, '').toLowerCase();
    return path.startsWith('/materials') || path.startsWith('/subjects');
  }

  function maybeOpenSiteAnnouncementModal(pathname) {
    const isMaterialsPath = isMaterialsAnnouncementPath(pathname);
    const key = isMaterialsPath ? MATERIALS_ANNOUNCEMENT_SESSION_KEY : SITE_ANNOUNCEMENT_SESSION_KEY;
    try {
      if (sessionStorage.getItem(key) === 'shown') {
        return;
      }
      sessionStorage.setItem(key, 'shown');
      if (isMaterialsPath) {
        sessionStorage.setItem(SITE_ANNOUNCEMENT_SESSION_KEY, 'shown');
      }
    } catch (error) {
      console.warn('[announcement] unable to persist session flag:', error);
    }

    openSiteAnnouncementModal();
  }

  function getMiniProgramBridgeConfig() {
    const bridge = document.getElementById('miniProgramBridge');
    return {
      scheme: bridge?.dataset.scheme?.trim() || '',
      schemeApi: bridge?.dataset.schemeApi?.trim() || ''
    };
  }

  function extractMiniProgramScheme(payload) {
    if (!payload) return '';
    if (typeof payload === 'string') return payload.trim();
    return [
      payload.url,
      payload.scheme,
      payload.openlink,
      payload.openLink,
      payload.link
    ].find((value) => typeof value === 'string' && value.trim())?.trim() || '';
  }

  async function resolveMiniProgramScheme() {
    if (cachedMiniProgramScheme) return cachedMiniProgramScheme;

    const config = getMiniProgramBridgeConfig();
    if (config.scheme) {
      cachedMiniProgramScheme = config.scheme;
      return cachedMiniProgramScheme;
    }

    if (!config.schemeApi) return '';

    if (!miniProgramSchemePromise) {
      miniProgramSchemePromise = (async () => {
        const endpoint = new URL(config.schemeApi, window.location.origin);
        endpoint.searchParams.set('path', window.location.pathname || '/');
        const response = await fetch(endpoint.toString(), {
          method: 'GET',
          credentials: 'same-origin',
          headers: { Accept: 'application/json, text/plain;q=0.9' }
        });

        if (!response.ok) {
          throw new Error(`mini program scheme request failed: ${response.status}`);
        }

        const contentType = response.headers.get('content-type') || '';
        const payload = contentType.includes('application/json')
          ? await response.json()
          : await response.text();
        const scheme = extractMiniProgramScheme(payload);

        if (!scheme) {
          throw new Error('mini program scheme response is empty');
        }

        cachedMiniProgramScheme = scheme;
        return cachedMiniProgramScheme;
      })().catch((error) => {
        miniProgramSchemePromise = null;
        throw error;
      });
    }

    return miniProgramSchemePromise;
  }

  function setMiniProgramButtonsBusy(isBusy) {
    document.querySelectorAll('[data-mini-program-open]').forEach((button) => {
      button.setAttribute('aria-busy', String(isBusy));
      if ('disabled' in button) {
        button.disabled = isBusy;
      }
    });
  }

  async function openMiniProgram(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }

    setMiniProgramButtonsBusy(true);
    try {
      const scheme = await resolveMiniProgramScheme();
      if (!scheme) {
        throw new Error('mini program scheme is not configured');
      }
      closeSiteAnnouncementModal();
      window.location.href = scheme;
      window.setTimeout(() => setMiniProgramButtonsBusy(false), 1200);
    } catch (error) {
      console.warn('[mini-program] unable to open mini program:', error);
      setMiniProgramButtonsBusy(false);
      window.alert('小程序链接暂未配置，请稍后再试。');
    }
  }

  function preloadMiniProgramScheme() {
    resolveMiniProgramScheme().catch(() => {});
  }

  function openDonationModal() {
    const modal = document.getElementById('donationModal');
    if (!modal) return;
    modal.querySelectorAll('img[data-src]').forEach((img) => {
      if (!img.getAttribute('src')) {
        img.src = img.dataset.src;
      }
    });
    modal.style.display = 'block';
  }

  function closeDonationModal() {
    const modal = document.getElementById('donationModal');
    if (modal) modal.style.display = 'none';
  }

  window.addEventListener('click', function(event) {
    const modal = document.getElementById('donationModal');
    if (modal && event.target === modal) closeDonationModal();
  });

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closeSiteAnnouncementModal();
      closeDonationModal();
      closeContactModal();
      closeSocialTip();
      closeQqChannelPopover();
    }
  });

  function toggleSocialTip() {
    const tip = document.getElementById('socialTip');
    if (!tip) return;
    const isOpen = tip.style.display === 'block';
    tip.style.display = isOpen ? 'none' : 'block';
    const trigger = document.querySelector('[aria-controls="socialTip"]');
    if (trigger) trigger.setAttribute('aria-expanded', String(!isOpen));
  }

  function closeSocialTip() {
    const tip = document.getElementById('socialTip');
    const trigger = document.querySelector('[aria-controls="socialTip"]');
    if (tip) tip.style.display = 'none';
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  }

  function openContactModal() {
    const pop = document.getElementById('contactPopover');
    if (pop) pop.style.display = 'block';
  }

  function closeContactModal() {
    const pop = document.getElementById('contactPopover');
    if (pop) pop.style.display = 'none';
  }

  function closeQqChannelPopover() {
    const pop = document.getElementById('qqChannelPopover');
    const trigger = document.querySelector('.qq-channel-btn');
    if (pop) pop.style.display = 'none';
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  }

  window.addEventListener('click', function(e) {
    const announcementModal = document.getElementById('siteAnnouncementModal');
    const tip = document.getElementById('socialTip');
    const contact = document.getElementById('contactPopover');
    const tipTrigger = document.querySelector('[aria-controls="socialTip"]');
    const contactBtn = document.querySelector('.contact-btn');
    const qqPopover = document.getElementById('qqChannelPopover');
    const qqBtn = document.querySelector('.qq-channel-btn');

    if (announcementModal && e.target === announcementModal) {
      closeSiteAnnouncementModal();
    }
    if (tip && tip.style.display === 'block') {
      if (e.target !== tip && !tip.contains(e.target) && (!tipTrigger || (e.target !== tipTrigger && !tipTrigger.contains(e.target)))) {
        closeSocialTip();
      }
    }
    if (contact && contact.style.display === 'block') {
      if (e.target !== contact && !contact.contains(e.target) && (!contactBtn || (e.target !== contactBtn && !contactBtn.contains(e.target)))) {
        closeContactModal();
      }
    }
    if (qqPopover && qqPopover.style.display === 'block') {
      if (e.target !== qqPopover && !qqPopover.contains(e.target) && (!qqBtn || (e.target !== qqBtn && !qqBtn.contains(e.target)))) {
        closeQqChannelPopover();
      }
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      preloadMiniProgramScheme();
      maybeOpenSiteAnnouncementModal(window.location.pathname);
    }, { once: true });
  } else {
    preloadMiniProgramScheme();
    maybeOpenSiteAnnouncementModal(window.location.pathname);
  }
</script>
