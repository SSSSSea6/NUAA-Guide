{{ define "main" }}
<section class="search-home">
    <div class="search-home__panel">
        <h1>搜索</h1>

        <form class="search-home__form" method="get" action="/search/all" novalidate>
            <label class="sr-only" for="searchHomeInput">搜索站内资源</label>
            <input
                id="searchHomeInput"
                type="search"
                class="search-home__input"
                name="q"
                placeholder="输入关键词"
                autocomplete="off"
                aria-label="搜索站内资源">
            <button class="search-home__submit" type="submit">搜索</button>
        </form>
    </div>
</section>
{{ end }}
