{{ define "main" }}
<section class="subject-terms-page">
    <header class="subject-terms-header">
        <h1>{{ .Title }}</h1>
        {{ with .Content }}
        <div class="subject-terms-intro">
            {{ . }}
        </div>
        {{ end }}
    </header>

    <div class="subject-directory" data-role="subject-directory">
        {{ range .Data.Terms }}
        <a class="subject-chip"
           data-role="subject-chip"
           data-subject-name="{{ .Page.Title }}"
           href="{{ .Page.Permalink }}">
            {{ .Page.Title }}
        </a>
        {{ end }}
    </div>
</section>
{{ end }}
