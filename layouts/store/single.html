{{ define "main" }}
<div class="content-section">
  <nav class="back-bar">
    <a class="back-link" href="{{ with .CurrentSection }}{{ .Permalink }}{{ else }}/store/{{ end }}">
      <span class="back-link__icon" aria-hidden="true">←</span>
      <span>返回{{ with .CurrentSection }} {{ .Title }}{{ end }}</span>
    </a>
  </nav>
  <article>
    <h2>{{ .Title }}</h2>
    {{ with .Params.link_url }}
    <div class="store-actions">
      <a href="{{ . }}" target="_blank" rel="noopener" class="service-button service-button--portal">前往购买/查看</a>
    </div>
    {{ end }}

    <div class="article-body">{{ .Content }}</div>

    {{ if .Params.tags }}
    <div class="tags">
      <strong>标签:</strong>
      {{ range .Params.tags }}
      <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}

    
  </article>
</div>
{{ end }}
