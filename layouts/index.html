{{ define "main" }}
<section class="home-landing" id="homeLanding">
    <div class="home-landing__backdrop" aria-hidden="true">
        <img src="{{ .Site.BaseURL }}images/logo.png" alt="" loading="lazy">
    </div>

    <!-- Title and tagline intentionally removed for a minimal landing -->

    <div class="home-landing__results" id="homeSearchResults" data-role="landing-results">
        <div class="home-landing__results-status" data-role="external-status"></div>
        <div class="home-landing__results-list" data-role="external-results"></div>
    </div>
    <div class="home-landing__search">
        <div class="home-landing__search-box">
            <div class="search-widget search-widget--home"
                 data-role="search-root"
                 data-search-context="home"
                 data-results-target="#homeSearchResults">
                <div class="search-widget__controls" data-role="search-controls">
                    <div class="search-widget__input-shell">
                        <input type="search"
                               class="search-widget__input"
                               data-role="search-input"
                               placeholder="请输入你要找的资源"
                               autocomplete="off"
                               aria-label="搜索资源">
                    </div>
                </div>
                <div class="search-widget__results" data-role="search-results" aria-live="polite"></div>
                <div class="search-widget__status" data-role="search-status" aria-live="assertive"></div>
            </div>
        </div>
    </div>
</section>
{{ end }}
