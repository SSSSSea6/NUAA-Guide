{{ define "main" }}
<div class="content-section">
    <h2>搜索学习资料</h2>

    <div class="search-input-container">
        <input type="text" id="search-input" placeholder="输入课程名、老师或关键词搜索..." class="search-input">
        <button id="search-button" class="search-button">搜索</button>
    </div>

    <div id="search-results"></div>

    <!-- 引入 Pagefind UI，路径使用 Hugo 的 relURL 以兼容 GitHub Pages -->
    <link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
    <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchButton = document.getElementById('search-button');
            const resultsContainer = document.getElementById('search-results');
            
            let pagefindUI = null;
            
            // 初始化 Pagefind
            function initPagefind() {
                if (typeof PagefindUI !== 'undefined') {
                    pagefindUI = new PagefindUI({
                        element: "#search-results",
                        showImages: false,
                        excerptLength: 20,
                        showSubResults: false,
                        resetStyles: false
                    });
                    return true;
                }
                return false;
            }
            
            // 尝试初始化，如果未加载则等待
            if (!initPagefind()) {
                let attempts = 0;
                const checkPagefind = setInterval(() => {
                    attempts++;
                    if (initPagefind() || attempts > 10) {
                        clearInterval(checkPagefind);
                        if (attempts > 10) {
                            resultsContainer.innerHTML = '<div class="error-message">搜索功能加载失败，请刷新页面重试。</div>';
                        }
                    }
                }, 100);
            }
            
            // 执行搜索
            function performSearch() {
                const query = searchInput.value.trim();
                if (query && pagefindUI) {
                    pagefindUI.triggerSearch(query);
                } else if (query) {
                    resultsContainer.innerHTML = '<div class="error-message">搜索功能尚未准备好，请稍后再试。</div>';
                } else {
                    resultsContainer.innerHTML = '';
                }
            }
            
            // 绑定事件
            searchButton.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
            
            // 如果 URL 带有 ?q=xxx，自动执行搜索
            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q');
            if (initialQuery) {
                searchInput.value = initialQuery;
                setTimeout(() => performSearch(), 500);
            }
        });
    </script>

    <style>
        .search-input-container {
            display: flex;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        
        .search-input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            border-right: none;
        }
        
        .search-button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
        }
        
        .search-button:hover {
            background-color: var(--secondary-color);
        }

        /* Pagefind 结果样式 */
        .pagefind-ui__result {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
        }
        
        .pagefind-ui__result-link {
            font-size: 1.2em;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }
        
        .pagefind-ui__result-link:hover {
            text-decoration: underline;
        }
        
        .pagefind-ui__result-excerpt {
            color: var(--text-muted);
            margin-top: 8px;
        }
        
        .pagefind-ui__message {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }
        
        .error-message {
            color: #dc3545;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            text-align: center;
        }

        /* 隐藏 Pagefind 自带搜索框 */
        .pagefind-ui__search-input {
            display: none !important;
        }
    </style>
</div>
{{ end }}
</div>
{{ end }}
