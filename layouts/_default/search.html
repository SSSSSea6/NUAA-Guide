{{ define "main" }}
<div class="content-section">
    <h2>搜索学习资料</h2>

    <!-- 使用自定义搜索框，而不是Pagefind自动生成的 -->
    <div class="search-input-container">
        <input type="text" id="custom-search-input" placeholder="输入课程名、老师或关键词搜索..." class="search-input">
        <button id="search-button" class="search-button">搜索</button>
    </div>

    <div id="search-results"></div>

    <!-- 引入 Pagefind UI CSS 但不引入 JS（我们将使用自定义JS） -->
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
    <script src="/pagefind/pagefind-ui.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('custom-search-input');
            const searchButton = document.getElementById('search-button');
            let pagefindUI = null;
            
            // 初始化 Pagefind UI，但不自动创建搜索框
            pagefindUI = new PagefindUI({
                element: "#search-results",
                showImages: false,
                showEmptyFilters: false,
                excerptLength: 20,
                // 禁用自动搜索框创建
                autofocus: false,
                showSubResults: false,
                // 初始化为空搜索，不显示任何结果
                resetStyles: false
            });
            
            // 隐藏 Pagefind 自动生成的搜索框（如果有）
            const pagefindSearch = document.querySelector('.pagefind-ui__search-input');
            if (pagefindSearch) {
                pagefindSearch.style.display = 'none';
            }
            
            // 自定义搜索功能
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    pagefindUI.search(query);
                } else {
                    // 清空搜索结果
                    document.getElementById('search-results').innerHTML = '';
                }
            }
            
            // 绑定搜索按钮点击事件
            searchButton.addEventListener('click', performSearch);
            
            // 绑定输入框回车事件
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        });
    </script>

    <style>
        /* 自定义搜索框样式 */
        .search-input-container {
            display: flex;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        
        .search-input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            border-right: none;
        }
        
        .search-button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
        }
        
        .search-button:hover {
            background-color: var(--secondary-color);
        }
        
        /* Pagefind UI 自定义样式 */
        .pagefind-ui__result {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
        }
        
        .pagefind-ui__result-link {
            font-size: 1.2em;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }
        
        .pagefind-ui__result-link:hover {
            text-decoration: underline;
        }
        
        .pagefind-ui__result-excerpt {
            color: var(--text-muted);
            margin-top: 8px;
        }
        
        .pagefind-ui__message {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }
    </style>
</div>
{{ end }}
