{{ define "main" }}
<div class="content-section">
    <h2>搜索学习资料</h2>

    <div id="search-box"></div>
    <div id="search-results"></div>

     <!-- 引入 Pagefind UI -->
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
    <script src="/pagefind/pagefind-ui.js"></script>
    <script src="/js/pagefind-search.js"></script>




<script>

    document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchButton = document.getElementById('search-button');
            const resultsContainer = document.getElementById('search-results');
    let pagefind = null;
    
    // 初始化 Pagefind
    async function initPagefind() {
        const pagefindModule = await import("/pagefind/pagefind.js");
        pagefind = await pagefindModule.getIndex();
        setupSearch();
    }
    
    function setupSearch() {
        searchInput.addEventListener('input', debounce(performSearch, 300));
    }
    
    async function performSearch() {
        const query = searchInput.value.trim();
        if (!query) {
            resultsContainer.innerHTML = '';
            return;
        }
        
        try {
            // 对中文查询进行特殊处理
            const processedQuery = processChineseQuery(query);
            const search = await pagefind.search(processedQuery);
            const results = await Promise.all(
                search.results.map(async result => {
                    const data = await result.data();
                    // 计算相关性分数，优先显示学习资料
                    data.score = calculateRelevance(data, query);
                    return data;
                })
            );
            
            // 过滤和排序结果
            const filteredResults = results
                .filter(result => result.url.includes('/materials/'))
                .sort((a, b) => b.score - a.score);
            
            renderResults(filteredResults, query);
        } catch (error) {
            console.error('搜索错误:', error);
            resultsContainer.innerHTML = '<p class="error-message">搜索过程中出现错误，请重试。</p>';
        }
    }
    
    // 处理中文查询词
    function processChineseQuery(query) {
        // 如果是单个中文字符，添加通配符以提高匹配率
        if (query.length === 1 && /[\u4e00-\u9fa5]/.test(query)) {
            return query + '*';
        }
        return query;
    }
    
    // 计算相关性分数
    function calculateRelevance(result, query) {
        let score = 0;
        const title = result.meta?.title || '';
        const content = result.excerpt || '';
        const tags = result.meta?.tags || '';
        
        // 标题匹配获得最高分数
        if (title.includes(query)) score += 10;
        
        // 内容匹配
        const contentMatches = (content.match(new RegExp(query, 'g')) || []).length;
        score += contentMatches * 2;
        
        // 标签匹配
        if (tags.includes(query)) score += 5;
        
        return score;
    }
    
    // 渲染结果
    function renderResults(results, query) {
        if (results.length === 0) {
            resultsContainer.innerHTML = `
                <div class="pagefind-ui__message">
                    没有找到与 "${query}" 相关的学习资料。
                    ${query.length === 1 ? '<br><small>提示: 单字搜索可能无法返回结果，请尝试更具体的词汇。</small>' : ''}
                </div>
            `;
            return;
        }
        
        resultsContainer.innerHTML = results.map(result => `
            <div class="pagefind-ui__result">
                <h3 class="pagefind-ui__result-title">
                    <a href="${result.url}" class="pagefind-ui__result-link">
                        ${result.meta.title || '无标题'}
                    </a>
                </h3>
                ${result.excerpt ? `
                    <p class="pagefind-ui__result-excerpt">
                        ${highlightQuery(result.excerpt, query)}
                    </p>
                ` : ''}
                ${result.meta.tags ? `
                    <div class="pagefind-ui__result-tags">
                        标签: ${result.meta.tags}
                    </div>
                ` : ''}
            </div>
        `).join('');
    }
    
    // 高亮显示搜索词
    function highlightQuery(text, query) {
        const regex = new RegExp(`(${query})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }
    
    // 防抖函数
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
    
    initPagefind();
});
</script>










    

<script>
       document.addEventListener('DOMContentLoaded', function() {
    // 获取所有文档的索引
    let pagefind = null;
    
    async function initPagefind() {
        // 动态导入 Pagefind
        const pagefindModule = await import("/pagefind/pagefind.js");
        pagefind = await pagefindModule.getIndex();
        
        // 设置搜索功能
        setupSearch();
    }
    
    function setupSearch() {
        const searchInput = document.getElementById('custom-search-input');
        const searchButton = document.getElementById('search-button');
        const resultsContainer = document.getElementById('search-results');
        
        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = '';
                return;
            }
            
            try {
                // 执行搜索
                const search = await pagefind.search(query);
                const results = await Promise.all(
                    search.results.map(async result => {
                        const data = await result.data();
                        return data;
                    })
                );
                
                // 过滤结果，只显示学习资料
                const filteredResults = results.filter(result => 
                    result.url.includes('/materials/')
                );
                
                // 渲染结果
                renderResults(filteredResults, query);
            } catch (error) {
                console.error('搜索错误:', error);
                resultsContainer.innerHTML = '<p class="error-message">搜索过程中出现错误，请重试。</p>';
            }
        }
        
        function renderResults(results, query) {
            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="pagefind-ui__message">
                        没有找到与 "${query}" 相关的学习资料。
                    </div>
                `;
                return;
            }
            
            resultsContainer.innerHTML = results.map(result => `
                <div class="pagefind-ui__result">
                    <h3 class="pagefind-ui__result-title">
                        <a href="${result.url}" class="pagefind-ui__result-link">
                            ${result.meta.title || '无标题'}
                        </a>
                    </h3>
                    ${result.excerpt ? `
                        <p class="pagefind-ui__result-excerpt">
                            ${result.excerpt}
                        </p>
                    ` : ''}
                    ${result.meta.tags ? `
                        <div class="pagefind-ui__result-tags">
                            标签: ${result.meta.tags}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        // 绑定事件
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    }
    
    initPagefind();
});
  </script>




    

 <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 Pagefind UI 并添加配置选项
            new PagefindUI({
                element: "#search-results",
                showImages: false,
                showEmptyFilters: false,
                excerptLength: 20,
                // 增加这些配置来改善中文搜索
                indexOptions: {
                    // 降低匹配阈值，使更多结果可见
                    threshold: 0.2,
                    // 增加前缀长度，改善短词匹配
                    prefixLength: 1,
                    // 禁用词干提取（对中文更友好）
                    stem: false
                },
                // 自定义搜索处理
                processTerm: function(term) {
                    // 对中文搜索词进行特殊处理
                    return term.toLowerCase().replace(/\s+/g, '');
                },
                // 自定义结果处理
                processResult: function(result) {
                    return {
                        ...result,
                        excerpt: result.excerpt || "暂无详细描述"
                    };
                }
            });
            
            // 隐藏 Pagefind 自动生成的搜索框（如果不需要）
            setTimeout(() => {
                const pagefindSearch = document.querySelector('.pagefind-ui__search-input');
                if (pagefindSearch) {
                    pagefindSearch.style.display = 'none';
                }
            }, 100);
        });
    </script>











    
    <style>
        window.addEventListener('DOMContentLoaded', (event) => {
            // 初始化 Pagefind UI
            new PagefindUI({
                element: "#search-results",
                showImages: false,
                showEmptyFilters: false,
                excerptLength: 20,
                processResult: function(result) {
                    // 自定义结果处理
                    return {
                        ...result,
                        excerpt: result.excerpt || result.meta.description || ''
                    };
                },
                processTerm: function(term) {
                    // 处理搜索词（可选）
                    return term.toLowerCase();
                }
            });
        });
    </script>

    <style>
        /* Pagefind UI 自定义样式 */
        .pagefind-ui__search-input {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .pagefind-ui__result {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
        }

        .pagefind-ui__result-link {
            font-size: 1.2em;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .pagefind-ui__result-link:hover {
            text-decoration: underline;
        }

        .pagefind-ui__result-excerpt {
            color: var(--text-muted);
            margin-top: 8px;
        }

        .pagefind-ui__result-tags {
            margin-top: 8px;
        }

        .pagefind-ui__result-tag {
            display: inline-block;
            background-color: var(--light-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
        }

        .pagefind-ui__message {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
        }

        .pagefind-ui__button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagefind-ui__button:hover {
            background-color: var(--secondary-color);
        }
    </style>
</div>
{{ end }}
