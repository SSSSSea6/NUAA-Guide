{{ define "main" }}
<section class="search-page" data-search-page data-default-tab="all">
    <header class="search-page__header">
        <h1 class="search-page__title" data-search-title>搜索</h1>

        <form class="search-page__form" data-search-form method="get" action="/search/all" novalidate>
            <input
                type="search"
                class="search-page__input"
                name="q"
                data-search-input
                placeholder="输入关键词"
                autocomplete="off"
                aria-label="搜索站内资源">
            <button class="search-page__submit" type="submit">搜索</button>
        </form>
    </header>

    <div class="search-page__status" data-search-status aria-live="polite" hidden></div>
    <div class="search-page__results-shell" data-search-results-shell hidden>
        <div class="search-page__results-viewport" data-search-scroll tabindex="0" aria-label="搜索结果列表">
            <div class="search-page__results" data-search-results></div>
            <div class="search-page__sentinel" data-search-sentinel aria-hidden="true"></div>
        </div>
    </div>
</section>
{{ end }}
