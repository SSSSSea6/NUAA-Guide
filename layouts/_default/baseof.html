<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">

    <style>
      /* 页面切换动画 */
      .transition-jelly-fade {
        transition: opacity 0.5s ease-in-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: 50% 50%; opacity: 1; transform: scale(1);
      }
      html.is-animating .transition-jelly-fade {
        opacity: 0; transform: scale(0.8);
      }

      /* --- “小红书”风格小弹窗样式 --- */
      .contact-bar {
        position: relative; /* 让弹窗相对于此容器定位 */
      }
      .contact-popover {
        position: absolute;
        bottom: 120%; /* 出现在按钮上方 */
        left: 50%;
        width: 300px;
        background: #fff;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        z-index: 100;
        
        /* 动画效果 */
        visibility: hidden;
        opacity: 0;
        transform: translate(-50%, 10px); /* 初始位置稍微向下偏离 */
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      }
      /* 弹窗下方的小三角 */
      .contact-popover::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        width: 0; 
        height: 0; 
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 10px solid #fff;
      }
      /* 弹窗被激活时 */
      .contact-popover.is-visible {
        visibility: visible;
        opacity: 1;
        transform: translateX(-50%); /* 恢复到正常位置 */
      }
    </style>
</head>
<body>
    <div class="site-container">
        {{ partial "header.html" . }}
        <main id="swup" class="site-content transition-jelly-fade">
            {{- block "main" . }}{{- end }}
        </main>
        {{ partial "footer.html" . }}
    </div>

    <script src="https://unpkg.com/swup@4"></script>
    <script src="/pagefind/pagefind-ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.0/dist/index.min.js" defer></script>
    <script defer src="/js/materials.js?v={{ now.Unix }}"></script>

    <script>
      const runInitializers = () => {
        // Pagefind 初始化
        const searchBox = document.querySelector('#search-box');
        if (searchBox) {
          searchBox.innerHTML = '';
          new PagefindUI({ element: "#search-box", showImages: false, showEmptyFilters: false, excerptLength: 20 });
        }

        // “联系我”小弹窗初始化
        const contactBtn = document.querySelector('.contact-btn');
        const contactPopover = document.getElementById('contactPopover');
        if (contactBtn && contactPopover) {
          contactBtn.addEventListener('click', (event) => {
            event.stopPropagation(); // 阻止点击事件冒泡到 document
            contactPopover.classList.toggle('is-visible');
          });
        }

        if (typeof window.initMaterialsPage === 'function') {
          window.initMaterialsPage();
        }
      };

      // 点击页面任何其他地方，关闭弹窗
      document.addEventListener('click', (event) => {
        const contactPopover = document.getElementById('contactPopover');
        // 确保弹窗存在且当前是可见的
        if (contactPopover && contactPopover.classList.contains('is-visible')) {
          contactPopover.classList.remove('is-visible');
        }
      });

      const swup = new Swup();
      runInitializers();
      swup.hooks.on('page:view', runInitializers);
    </script>
</body>
</html>
