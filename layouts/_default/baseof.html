<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- +++ 1. 添加极简且丝滑的“果冻”动画样式 +++ -->
    <style>
      /* 定义“果冻”动画效果 */
      .transition-jelly {
        /*
         * transition 属性解释:
         * transform: 对形变（如此处的缩放）进行动画
         * 0.5s: 动画时长为 0.5 秒
         * cubic-bezier(...): 自定义缓动函数，这是“Q弹”效果的核心
         */
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: 50% 50%; /* 确保从中心点缩放 */
      }

      /* 当页面“离开”时，内容缩小到 90% */
      html.is-animating .transition-jelly {
        transform: scale(0.9);
      }
    </style>
</head>
<body>
    <div class="site-container">
        {{ partial "header.html" . }}
        
        <!-- id="swup" 是必须的，class 用于应用“果冻”动画 */ -->
        <main id="swup" class="site-content transition-jelly">
            {{- block "main" . }}{{- end }}
        </main>
        
        {{ partial "footer.html" . }}
    </div>

    <!-- 引入 swup.js 库 -->
    <script src="https://unpkg.com/swup@4"></script>

    <!-- 初始化 swup.js -->
    <script>
      const swup = new Swup();
    </script>
</body>
</html>
