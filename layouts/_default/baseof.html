<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Pagefind UI 的 CSS -->
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">

    <!-- +++ 1. 添加“超级Q弹 + 淡入淡出”动画样式 +++ -->
    <style>
      /* 定义动画效果 */
      .transition-jelly-fade {
        /*
         * transition 属性解释:
         * opacity 0.5s ease-in-out: 透明度在 0.5 秒内平滑过渡
         * transform 0.5s cubic-bezier(...): 形变（缩放）使用自定义的“Q弹”曲线
         */
        transition: opacity 0.5s ease-in-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: 50% 50%; /* 从中心缩放 */
        opacity: 1;
        transform: scale(1);
      }

      /* 当页面“离开”时，内容缩小并变为透明 */
      html.is-animating .transition-jelly-fade {
        opacity: 0;
        transform: scale(0.8);
      }
    </style>
</head>
<body>
    <div class="site-container">
        {{ partial "header.html" . }}
        
        <main id="swup" class="site-content transition-jelly-fade">
            {{- block "main" . }}{{- end }}
        </main>
        
        {{ partial "footer.html" . }}
    </div>

    <!-- 核心 JS 库 -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="/pagefind/pagefind-ui.js"></script>

    <!-- 整合了 Swup 和 Pagefind 的初始化脚本 -->
    <script>
      // 将 Pagefind 的初始化包装成一个函数
      const initPagefind = () => {
        if (document.querySelector('#search-box')) {
          document.querySelector('#search-box').innerHTML = '';
          new PagefindUI({
            element: "#search-box",
            showImages: false,
            showEmptyFilters: false,
            excerptLength: 20
          });
        }
      };

      // Swup 初始化
      const swup = new Swup();

      // 页面首次加载时，运行一次 Pagefind 初始化
      initPagefind();

      // 每次 Swup 完成页面切换后，再次运行 Pagefind 初始化
      swup.hooks.on('page:view', initPagefind);
    </script>
</body>
</html>
