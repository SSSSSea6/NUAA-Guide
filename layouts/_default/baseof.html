<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">

    <style>
      /* 页面切换动画 */
      .transition-jelly-fade {
        transition: opacity 0.5s ease-in-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: 50% 50%;
        opacity: 1;
        transform: scale(1);
      }
      html.is-animating .transition-jelly-fade {
        opacity: 0;
        transform: scale(0.8);
      }

      /* --- 最终版弹窗样式 (背景可滚动 + 屏幕居中) --- */
      
      /* 弹窗的灰色背景遮罩层 */
      .contact-modal {
        /* 关键：使用 fixed 定位，使其相对于浏览器窗口固定 */
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        /* 使用 flex 布局将内容盒子居中 */
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;

        /* 动画效果：默认隐藏 */
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      /* 弹窗的内容盒子 */
      .contact-modal-content {
        max-height: 90vh; /* 限制最大高度，防止内容过长超出屏幕 */
        overflow-y: auto; /* 内容过长时，内部滚动 */
        
        /* 动画效果：默认缩小 */
        transform: scale(0.9);
        transition: transform 0.3s ease;
      }
      
      /* 当弹窗被激活时 */
      .contact-modal.is-open {
        visibility: visible;
        opacity: 1;
      }
      .contact-modal.is-open .contact-modal-content {
        transform: scale(1);
      }
    </style>
</head>
<body>
    <div class="site-container">
        {{ partial "header.html" . }}
        
        <main id="swup" class="site-content transition-jelly-fade">
            {{- block "main" . }}{{- end }}
        </main>
        
        {{ partial "footer.html" . }}
    </div>

    <!-- 核心 JS 库 -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="/pagefind/pagefind-ui.js"></script>

    <!-- 整合所有初始化脚本 (最终版) -->
    <script>
      const runInitializers = () => {
        // Pagefind 初始化
        const searchBox = document.querySelector('#search-box');
        if (searchBox) {
          searchBox.innerHTML = '';
          new PagefindUI({ element: "#search-box", showImages: false, showEmptyFilters: false, excerptLength: 20 });
        }

        // “联系我”弹窗初始化
        const contactModal = document.getElementById('contactModal');
        const contactOpenBtn = document.querySelector('.contact-btn');
        if (contactModal && contactOpenBtn) {
          const openModal = () => {
            contactModal.classList.add('is-open');
          };
          const closeModal = () => {
            contactModal.classList.remove('is-open');
          };
          
          contactOpenBtn.addEventListener('click', openModal);
          
          contactModal.addEventListener('click', (event) => {
            if (event.target.classList.contains('contact-close') || event.target === contactModal) {
              closeModal();
            }
          });
        }
      };

      const swup = new Swup();
      runInitializers();
      swup.hooks.on('page:view', runInitializers);
    </script>
</body>
</html>
