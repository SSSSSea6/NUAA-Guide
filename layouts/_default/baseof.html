<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">

    <style>
      /* 动画效果 */
      .transition-jelly-fade {
        transition: opacity 0.5s ease-in-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: 50% 50%;
        opacity: 1;
        transform: scale(1);
      }
      html.is-animating .transition-jelly-fade {
        opacity: 0;
        transform: scale(0.8);
      }
      /* +++ 新增：当弹窗打开时，禁止body滚动 +++ */
      body.modal-open {
        overflow: hidden;
      }
    </style>
</head>
<body>
    <div class="site-container">
        {{ partial "header.html" . }}
        
        <main id="swup" class="site-content transition-jelly-fade">
            {{- block "main" . }}{{- end }}
        </main>
        
        {{ partial "footer.html" . }}
    </div>

    <!-- 核心 JS 库 -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="/pagefind/pagefind-ui.js"></script>

    <!-- +++ 整合所有初始化脚本 +++ -->
    <script>
      // --- Pagefind 初始化逻辑 ---
      const initPagefind = () => {
        const searchBox = document.querySelector('#search-box');
        if (searchBox) {
          searchBox.innerHTML = '';
          new PagefindUI({ element: "#search-box", showImages: false, showEmptyFilters: false, excerptLength: 20 });
        }
      };

      // +++ 新增：“联系我”弹窗初始化逻辑 +++
      const initContactModal = () => {
        const modal = document.getElementById('contactModal');
        const openBtn = document.querySelector('.contact-btn'); // 使用 class 获取打开按钮
        const closeBtn = document.querySelector('.contact-close'); // 使用 class 获取关闭按钮

        // 确保所有元素都存在于当前页面
        if (modal && openBtn && closeBtn) {
          openBtn.addEventListener('click', () => {
            modal.style.display = 'block';
            document.body.classList.add('modal-open');
          });

          closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            document.body.classList.remove('modal-open');
          });

          // 点击弹窗外部区域也可以关闭
          modal.addEventListener('click', (event) => {
            if (event.target === modal) {
              modal.style.display = 'none';
              document.body.classList.remove('modal-open');
            }
          });
        }
      };

      // --- Swup 初始化逻辑 ---
      const swup = new Swup();

      // --- 钩子函数：在页面加载和切换时运行所有初始化 ---
      const runInitializers = () => {
        initPagefind();
        initContactModal();
      };

      // 首次加载时运行
      runInitializers();
      // 每次页面切换后运行
      swup.hooks.on('page:view', runInitializers);
    </script>
</body>
</html>
