<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">

    <style>
      /* 页面切换动画 */
      .transition-jelly-fade {
        transition: opacity 0.5s ease-in-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: 50% 50%;
        opacity: 1;
        transform: scale(1);
      }
      html.is-animating .transition-jelly-fade {
        opacity: 0;
        transform: scale(0.8);
      }

      /* --- Modal Fixed Centering Styles (核心改动) --- */

      /* 弹窗的灰色背景遮罩层 */
      .contact-modal {
        /* 关键：使用 fixed 定位，让它脱离文档流，固定在屏幕上 */
        position: fixed;
        /* 覆盖整个屏幕 */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* 使用 flex 布局轻松地将子元素（内容盒子）居中 */
        display: flex;
        align-items: center;
        justify-content: center;
        /* 半透明背景 */
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000; /* 确保在最顶层 */
      }

      /* 弹窗的内容盒子 */
      .contact-modal-content {
        /* 限制内容盒子的最大高度，不超过屏幕的90% */
        max-height: 90vh;
        /* 当内容超出最大高度时，让内容盒子内部出现滚动条 */
        overflow-y: auto;
      }
    </style>
</head>
<body>
    <div class="site-container">
        {{ partial "header.html" . }}
        
        <main id="swup" class="site-content transition-jelly-fade">
            {{- block "main" . }}{{- end }}
        </main>
        
        {{ partial "footer.html" . }}
    </div>

    <!-- 核心 JS 库 -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="/pagefind/pagefind-ui.js"></script>

    <!-- 整合所有初始化脚本 -->
    <script>
      const runInitializers = () => {
        // Pagefind 初始化
        const searchBox = document.querySelector('#search-box');
        if (searchBox) {
          searchBox.innerHTML = '';
          new PagefindUI({ element: "#search-box", showImages: false, showEmptyFilters: false, excerptLength: 20 });
        }

        // “联系我”弹窗初始化
        const contactModal = document.getElementById('contactModal');
        const contactOpenBtn = document.querySelector('.contact-btn');
        if (contactModal && contactOpenBtn) {
          const openModal = () => {
            contactModal.style.display = 'flex'; // 使用 flex 来激活居中
          };
          const closeModal = () => {
            contactModal.style.display = 'none';
          };
          
          contactOpenBtn.addEventListener('click', openModal);
          
          contactModal.addEventListener('click', (event) => {
            if (event.target.classList.contains('contact-close') || event.target === contactModal) {
              closeModal();
            }
          });
        }
      };

      const swup = new Swup();
      runInitializers();
      swup.hooks.on('page:view', runInitializers);
    </script>
</body>
</html>
