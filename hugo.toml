# hugo.toml
baseURL = "https://www.nuaaguide.online/"
languageCode = "zh-cn"
title = "  NUAA Guide 校园指北"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]


[params]
  description = "南京航空航天大学校园指北 - 免费的学习资料、生活指南与实用信息分享平台"
  keywords = ["NUAA", "南航", "学习资料", "校园指南", "大学生活"]
  # 您的 R2 公共自定义域 URL (最佳实践：末尾不带斜杠)
  r2_base_url = "https://assets.nuaa.cc"
  # 微信小程序 URL Scheme。可填写后端预生成的 weixin://dl/business/?t=...
  mini_program_scheme = ""
  # 微信小程序 URL Scheme 后端接口。接口可返回纯文本链接，或 JSON：{"url":"weixin://dl/business/?t=..."}
  mini_program_scheme_api = "https://miniapp.nuaa.cc/"
  materials_section = "undergraduate"
  materials_courses_url = "https://upload.nuaa.cc/v1/materials/courses?section=undergraduate"
  materials_course_url = "https://upload.nuaa.cc/v1/materials/course"
  materials_download_ticket_url = "https://upload.nuaa.cc/v1/materials/download-ticket"

[outputs]
  home = ["HTML"]
  section = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 1
  [[menu.main]]
    name = "实用工具"
    url = "/"
    weight = 2
  [[menu.main]]
    name = "学习资料"
    url = "/materials/"
    weight = 3
