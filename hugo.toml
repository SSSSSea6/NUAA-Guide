# hugo.toml
baseURL = "https://nuaaguide.online/"
languageCode = "zh-cn"
title = "  NUAA Guide 校园指北"
enableRobotsTXT = true


[params]
  description = "南京航空航天大学校园指北 - 免费的学习资料、生活指南与实用信息分享平台"
  keywords = ["NUAA", "南航", "学习资料", "校园指南", "大学生活"]
  # 您的 R2 公共自定义域 URL (最佳实践：末尾不带斜杠)
  r2_base_url = "https://assets.nuaaguide.shop"

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "JSON"]

[outputFormats.JSON]
  baseName = "index"
  mediaType = "application/json"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# 新增分类法配置
[taxonomies]
  tag = "tags"
  subject = "subjects"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "实用工具"
    url = "/guides/"
    weight = 2
  [[menu.main]]
    name = "学习资料"
    url = "/subjects/"
    weight = 3
  [[menu.main]]
    name = "常用软件下载"
    url = "/software/"
    weight = 4
  [[menu.main]]
    name = "常用网址跳转"
    url = "/links/"
    weight = 5

[pagination]
  pagerSize = 12
